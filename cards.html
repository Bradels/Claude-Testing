<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Cards — Claude Code Cloud</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --accent: #d4a574;
            --accent-light: #e8c9a0;
            --accent-dark: #b8875a;
        }

        body {
            background: #060609;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* ── Orbs ── */
        .orb { position: fixed; border-radius: 50%; filter: blur(120px); opacity: 0.12; pointer-events: none; z-index: 0; }
        .orb-1 { width: 500px; height: 500px; background: #7c6ce0; top: -150px; right: -100px; animation: f1 22s ease-in-out infinite; }
        .orb-2 { width: 400px; height: 400px; background: var(--accent); bottom: -100px; left: -80px; animation: f2 18s ease-in-out infinite; }
        @keyframes f1 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-60px,80px)} }
        @keyframes f2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(50px,-60px)} }

        .content-wrapper { position: relative; z-index: 1; }

        /* ── Navbar (shared with index) ── */
        .theme-toggle {
            width: 40px; height: 40px; border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05);
            color: var(--accent-light); display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem; cursor: pointer; transition: background 0.3s, border-color 0.3s, transform 0.3s;
        }
        .theme-toggle:hover { background: rgba(255,255,255,0.1); border-color: var(--accent); transform: scale(1.05); }
        .theme-toggle .bi-sun-fill { display: none; }
        .theme-toggle .bi-moon-stars-fill { display: inline; }

        .btn-accent {
            background: linear-gradient(135deg, var(--accent-dark), var(--accent));
            color: #000; border: none; padding: 0.5rem 1.25rem; font-weight: 600;
            border-radius: 10px; font-size: 0.85rem; transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-accent:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(212,165,116,0.25); color: #000; }

        .btn-outline-accent {
            border: 1px solid rgba(212,165,116,0.4); color: var(--accent-light);
            padding: 0.5rem 1.25rem; font-weight: 600; border-radius: 10px; font-size: 0.85rem;
            background: transparent; transition: background 0.2s, border-color 0.2s;
        }
        .btn-outline-accent:hover { background: rgba(212,165,116,0.08); border-color: var(--accent); color: var(--accent-light); }

        /* ── Filter bar ── */
        .filter-bar {
            display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 2rem;
            justify-content: center;
        }
        .filter-btn {
            padding: 0.4rem 1rem; border-radius: 50px; font-size: 0.8rem; font-weight: 600;
            border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.04);
            color: #999; cursor: pointer; transition: all 0.25s;
        }
        .filter-btn:hover { border-color: rgba(255,255,255,0.2); color: #ccc; }
        .filter-btn.active { border-color: var(--accent); color: var(--accent-light); background: rgba(212,165,116,0.1); }

        /* ── Card grid ── */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, 252px);
            gap: 2rem;
            padding-bottom: 4rem;
            justify-content: center;
        }

        /* ── MTG Card — 63:88 ratio (real card proportions) ── */
        .mtg-card {
            width: 252px;
            height: 352px;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: default;
        }
        .mtg-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .mtg-card-inner {
            border-radius: 14px;
            padding: 8px;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, #e8dfc8, #d8ccb0, #e4d9c2);
        }

        .mtg-card-frame {
            border-radius: 10px;
            background: #c8bfa8;
            border: 1px solid rgba(0,0,0,0.12);
            overflow: hidden;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* Card header: name + mana */
        .card-header-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 6px 8px 5px; background: rgba(255,255,255,0.45);
            border-radius: 6px 6px 0 0; min-height: 30px;
            border-bottom: 1px solid rgba(0,0,0,0.1);
            flex-shrink: 0;
        }
        .card-name {
            font-size: 0.78rem; font-weight: 700; color: #1a1a1a;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            flex: 1; margin-right: 6px;
        }
        .mana-cost { display: flex; gap: 2px; flex-shrink: 0; }
        .mana-pip {
            width: 16px; height: 16px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.55rem; font-weight: 800; color: #111;
            border: 1px solid rgba(0,0,0,0.3); text-shadow: none;
        }
        .mana-pip.W { background: linear-gradient(135deg, #f9f5e3, #e8dfc0); }
        .mana-pip.U { background: linear-gradient(135deg, #4aa4d4, #1a6bc4); color: #fff; }
        .mana-pip.B { background: linear-gradient(135deg, #555, #222); color: #ccc; }
        .mana-pip.R { background: linear-gradient(135deg, #e86040, #c4351e); color: #fff; }
        .mana-pip.G { background: linear-gradient(135deg, #4aad5a, #2a7c3a); color: #fff; }
        .mana-pip.C { background: linear-gradient(135deg, #bbb, #888); }
        .mana-pip.X { background: linear-gradient(135deg, #bbb, #888); }
        .mana-pip.generic { background: linear-gradient(135deg, #d0d0d0, #999); }

        /* Art box */
        .card-art {
            height: 130px; flex-shrink: 0;
            margin: 4px 6px; border-radius: 4px;
            overflow: hidden; position: relative;
        }
        .card-art-inner {
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            font-size: 3rem; opacity: 0.6;
        }

        /* Art patterns per card theme */
        .art-architect { background: linear-gradient(135deg, #1a1a3e, #2a2a6e, #4a4aae); }
        .art-injection { background: linear-gradient(135deg, #0a2a4a, #1a1a2e, #2a0a3a); }
        .art-recursion { background: linear-gradient(135deg, #0e3a6e, #1a5a9e, #0a2a5e); }
        .art-overflow { background: linear-gradient(135deg, #5e1a0a, #8e2a1a, #ae4a2a); }
        .art-conflict { background: linear-gradient(135deg, #2a0a1a, #4a1a2a, #1a0a0a); }
        .art-generator { background: linear-gradient(135deg, #0a3a1a, #1a5a2a, #2a7a3a); }
        .art-null { background: linear-gradient(135deg, #0a0a0a, #1a1a2a, #0a0a1a); }
        .art-sandbox { background: linear-gradient(135deg, #3a3a4a, #5a5a6a, #4a4a5a); }
        .art-hydra { background: linear-gradient(135deg, #0a4a1a, #1a6a2a, #0a3a0a); }
        .art-duck { background: linear-gradient(135deg, #e8e4c0, #f0ead0, #d8d0a0); }
        .art-push { background: linear-gradient(135deg, #6e2a1a, #9e4a2a, #c06a3a); }
        .art-loop { background: linear-gradient(135deg, #0a1a4a, #1a2a7a, #2a3aaa); }

        /* Tea Ceremony set — art patterns */
        .art-tea-token { background: linear-gradient(135deg, #a07030, #c89050, #e8b870); }
        .art-tea-garden { background: linear-gradient(135deg, #1a5a2a, #2a8a3a, #3aaa4a); }
        .art-greenhouse { background: linear-gradient(135deg, #2a7a3a, #4aaa5a, #8acca0); }
        .art-zen-garden { background: linear-gradient(135deg, #6a7a6a, #8a9a8a, #4a6a4a); }
        .art-the-mansion { background: linear-gradient(135deg, #1a0a2a, #2a1a3a, #0a0a1a); }
        .art-the-parlor { background: linear-gradient(135deg, #2a1a1a, #3a2a2a, #1a0a0a); }
        .art-the-cellar { background: linear-gradient(135deg, #0a0a0a, #1a1a1a, #2a1a0a); }
        .art-the-gallery { background: linear-gradient(135deg, #1a0a1a, #2a1a2a, #3a2a3a); }
        .art-overgrown-manor { background: linear-gradient(135deg, #0a2a0a, #1a1a1a, #2a3a1a); }
        .art-tea-master { background: linear-gradient(135deg, #e8dfc8, #f0e8d0, #d8cca8); }
        .art-firebrew-adept { background: linear-gradient(135deg, #c04020, #e06030, #f08040); }
        .art-scalding-preparation { background: linear-gradient(135deg, #a03020, #c04030, #e05040); }
        .art-mindful-steeping { background: linear-gradient(135deg, #d8d0b8, #e8e0c8, #c8c0a8); }
        .art-kettle-of-inspiration { background: linear-gradient(135deg, #b05030, #d07040, #e8a060); }
        .art-ravenous-guest { background: linear-gradient(135deg, #1a0a2a, #2a0a3a, #3a1a4a); }
        .art-scalding-sipper { background: linear-gradient(135deg, #c03010, #e04020, #f06030); }
        .art-ember-glutton { background: linear-gradient(135deg, #4a0a0a, #6a1a1a, #2a0a0a); }
        .art-etiquette-of-stillness { background: linear-gradient(135deg, #e8d8b8, #f0e8d0, #d8c8a0); }
        .art-ceremony-of-reflection { background: linear-gradient(135deg, #2a4a8a, #3a5aaa, #4a6aca); }
        .art-code-of-the-table { background: linear-gradient(135deg, #8a9aba, #a0b0d0, #b8c8e0); }
        .art-fertile-offering { background: linear-gradient(135deg, #2a6a2a, #3a8a3a, #5aaa5a); }
        .art-generous-canopy { background: linear-gradient(135deg, #1a5a1a, #2a7a2a, #4a9a3a); }
        .art-gift-of-the-wellspring { background: linear-gradient(135deg, #1a5a4a, #2a7a6a, #3a9a8a); }
        .art-porcelain-teapot { background: linear-gradient(135deg, #c8d8e8, #e0e8f0, #a8b8d0); }
        .art-debt-collector { background: linear-gradient(135deg, #3a4a6a, #4a5a8a, #5a6aaa); }
        .art-ornamental-vase { background: linear-gradient(135deg, #b8c8d8, #d0d8e8, #e0e8f0); }

        /* Type line */
        .card-type-line {
            padding: 4px 8px; font-size: 0.68rem; font-weight: 600;
            color: #1a1a1a; background: rgba(255,255,255,0.4);
            border-top: 1px solid rgba(0,0,0,0.1);
            border-bottom: 1px solid rgba(0,0,0,0.1);
            flex-shrink: 0;
        }

        /* Text box */
        .card-text-box {
            padding: 8px; flex: 1;
            background: rgba(255,255,255,0.35); border-radius: 0 0 6px 6px;
            overflow-y: auto; position: relative;
        }
        .card-rules {
            font-size: 0.65rem; line-height: 1.45; color: #1a1a1a;
            margin-bottom: 0.3rem;
        }
        .card-rules p { margin-bottom: 0.2rem; }
        .card-rules p:last-child { margin-bottom: 0; }
        .card-flavor {
            font-size: 0.6rem; font-style: italic; color: #4a4a4a;
            border-top: 1px solid rgba(0,0,0,0.12); padding-top: 0.3rem;
            margin-top: 0.2rem; line-height: 1.4;
        }

        /* P/T box */
        .card-pt {
            position: absolute; bottom: 6px; right: 6px;
            background: rgba(255,255,255,0.5); border: 1px solid rgba(0,0,0,0.15);
            border-radius: 5px; padding: 1px 8px;
            font-size: 0.78rem; font-weight: 800; color: #1a1a1a;
        }

        /* Rarity gem */
        .card-rarity {
            position: absolute; bottom: 6px; left: 50%;
            transform: translateX(-50%);
            width: 10px; height: 10px; border-radius: 50%;
            border: 1px solid rgba(0,0,0,0.3);
        }
        .rarity-common { background: #111; }
        .rarity-uncommon { background: linear-gradient(135deg, #7a8a9a, #c0ccd8); }
        .rarity-rare { background: linear-gradient(135deg, #c9a43c, #e8c84a); }
        .rarity-mythic { background: linear-gradient(135deg, #e85a20, #f08030); }

        /* ── Light theme ── */
        [data-bs-theme="light"] body { background: #f8f7f4; }
        [data-bs-theme="light"] .orb { opacity: 0.06; }
        [data-bs-theme="light"] nav.navbar { background: rgba(248,247,244,0.85) !important; border-bottom-color: rgba(0,0,0,0.06) !important; }
        [data-bs-theme="light"] .navbar-brand { color: #1a1a2e; }
        [data-bs-theme="light"] .page-title { color: #1a1a2e; }
        [data-bs-theme="light"] .page-subtitle { color: #555; }
        [data-bs-theme="light"] .filter-btn { border-color: rgba(0,0,0,0.1); background: rgba(0,0,0,0.03); color: #777; }
        [data-bs-theme="light"] .filter-btn:hover { border-color: rgba(0,0,0,0.2); color: #444; }
        [data-bs-theme="light"] .filter-btn.active { border-color: var(--accent); color: var(--accent-dark); background: rgba(212,165,116,0.08); }
        [data-bs-theme="light"] .theme-toggle { border-color: rgba(0,0,0,0.1); background: rgba(0,0,0,0.04); color: var(--accent-dark); }
        [data-bs-theme="light"] .theme-toggle:hover { background: rgba(0,0,0,0.08); }
        [data-bs-theme="light"] .theme-toggle .bi-sun-fill { display: inline; }
        [data-bs-theme="light"] .theme-toggle .bi-moon-stars-fill { display: none; }
        [data-bs-theme="light"] .btn-outline-accent { color: var(--accent-dark); }
        [data-bs-theme="light"] footer { border-top-color: rgba(0,0,0,0.06); color: #999; }

        /* ── Animations ── */
        .card-enter { opacity: 0; transform: translateY(20px); animation: cardIn 0.5s ease forwards; }
        @keyframes cardIn { to { opacity: 1; transform: translateY(0); } }

        footer { border-top: 1px solid rgba(255,255,255,0.06); padding: 2rem 0; color: #4b5563; font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="content-wrapper">

        <!-- Navbar -->
        <nav class="navbar navbar-dark fixed-top" style="background: rgba(6,6,9,0.8); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(255,255,255,0.05);">
            <div class="container">
                <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="index.html">
                    <i class="bi bi-lightning-charge-fill" style="color: var(--accent);"></i>
                    Claude Code Cloud
                </a>
                <div class="d-flex align-items-center gap-2">
                    <a href="index.html" class="btn btn-sm btn-outline-accent">
                        <i class="bi bi-house me-1"></i> Home
                    </a>
                    <a href="claude-says.html" class="btn btn-sm btn-outline-accent">
                        <i class="bi bi-pencil-square me-1"></i> Blog
                    </a>
                    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
                        <i class="bi bi-moon-stars-fill"></i>
                        <i class="bi bi-sun-fill"></i>
                    </button>
                </div>
            </div>
        </nav>

        <div class="container" style="padding-top: 100px;">

            <!-- Header -->
            <div class="text-center mb-4">
                <div class="text-uppercase fw-semibold small mb-2" style="letter-spacing:0.15em; color: var(--accent);">Collection</div>
                <h1 class="page-title fw-bold mb-2" style="font-size: clamp(2rem, 4vw, 3rem); letter-spacing: -0.02em;">Custom Card Gallery</h1>
                <p class="page-subtitle mx-auto" style="color: #6b7280; max-width: 500px;">
                    Developer-themed Magic cards, loaded from <code>data/cards.json</code>. Add your own — just edit the JSON.
                </p>
            </div>

            <!-- Filters -->
            <div class="filter-bar" id="filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="white"><span style="color:#f9f5e3;">&#9679;</span> White</button>
                <button class="filter-btn" data-filter="blue"><span style="color:#4aa4d4;">&#9679;</span> Blue</button>
                <button class="filter-btn" data-filter="black"><span style="color:#888;">&#9679;</span> Black</button>
                <button class="filter-btn" data-filter="red"><span style="color:#e86040;">&#9679;</span> Red</button>
                <button class="filter-btn" data-filter="green"><span style="color:#4aad5a;">&#9679;</span> Green</button>
                <button class="filter-btn" data-filter="multi"><span style="color:#e8c84a;">&#9679;</span> Multi</button>
                <button class="filter-btn" data-filter="colorless"><span style="color:#bbb;">&#9679;</span> Colorless</button>
            </div>

            <!-- Card count -->
            <div class="text-center mb-4" style="color: #555; font-size: 0.85rem;">
                <span id="cardCount"></span>
            </div>

            <!-- Cards -->
            <div class="card-grid" id="cardGrid"></div>
        </div>

        <footer>
            <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center gap-2">
                <span><i class="bi bi-lightning-charge-fill" style="color:var(--accent);"></i> Built by Claude Code</span>
                <span>Cards loaded from <code>data/cards.json</code></span>
            </div>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // ── Theme toggle (shared logic) ──
        const root = document.documentElement;
        const toggle = document.getElementById('themeToggle');
        const stored = localStorage.getItem('theme');
        if (stored) root.setAttribute('data-bs-theme', stored);
        toggle.addEventListener('click', () => {
            const next = root.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
            root.setAttribute('data-bs-theme', next);
            localStorage.setItem('theme', next);
        });

        // ── Mana cost parser ──
        function parseMana(manaStr) {
            if (!manaStr) return '';
            const pips = [];
            const re = /\{([^}]+)\}/g;
            let m;
            while ((m = re.exec(manaStr)) !== null) {
                const val = m[1];
                let cls = 'generic';
                if ('WUBRGC'.includes(val)) cls = val;
                else if (val === 'X') cls = 'X';
                pips.push(`<span class="mana-pip ${cls}">${val}</span>`);
            }
            return pips.join('');
        }

        // ── Art icons ──
        const artIcons = {
            architect: '&#128736;', injection: '&#128137;', recursion: '&#128260;',
            overflow: '&#128165;', conflict: '&#9876;', generator: '&#127793;',
            null: '&#128128;', sandbox: '&#128230;', hydra: '&#128009;',
            duck: '&#129414;', push: '&#128640;', loop: '&#9854;',
            'tea-token': '&#9749;', 'tea-garden': '&#127807;', 'greenhouse': '&#127793;',
            'zen-garden': '&#9968;', 'the-mansion': '&#127984;', 'the-parlor': '&#128138;',
            'the-cellar': '&#128375;', 'the-gallery': '&#128444;', 'overgrown-manor': '&#127963;',
            'tea-master': '&#128524;', 'firebrew-adept': '&#128293;', 'scalding-preparation': '&#127798;',
            'mindful-steeping': '&#128718;', 'kettle-of-inspiration': '&#9749;',
            'ravenous-guest': '&#128065;', 'scalding-sipper': '&#129380;', 'ember-glutton': '&#128520;',
            'etiquette-of-stillness': '&#128220;', 'ceremony-of-reflection': '&#128167;',
            'code-of-the-table': '&#9878;', 'fertile-offering': '&#127793;',
            'generous-canopy': '&#127795;', 'gift-of-the-wellspring': '&#128167;',
            'porcelain-teapot': '&#127861;', 'debt-collector': '&#128179;', 'ornamental-vase': '&#127994;'
        };

        // ── Card color logic ──
        function getCardColor(colors) {
            if (!colors || colors.length === 0) return 'colorless';
            if (colors.length > 1) return 'multi';
            return colors[0];
        }

        // ── Render a single card ──
        function renderCard(card, index) {
            const color = getCardColor(card.colors);
            const manaHtml = parseMana(card.manaCost);
            const artClass = `art-${card.art || 'sandbox'}`;
            const artIcon = artIcons[card.art] || '&#9733;';
            const typeLine = card.subtype ? `${card.type} — ${card.subtype}` : card.type;

            // Split rules text by newlines into paragraphs
            const rulesHtml = (card.text || '').split('\n').map(line =>
                `<p>${line.replace(/\{([^}]+)\}/g, '<b>{$1}</b>')}</p>`
            ).join('');

            const flavorHtml = card.flavorText
                ? `<div class="card-flavor">${card.flavorText.replace(/\\n/g, '<br>')}</div>`
                : '';

            const ptHtml = (card.power !== null && card.toughness !== null)
                ? `<div class="card-pt">${card.power}/${card.toughness}</div>`
                : '';

            const rarityClass = `rarity-${card.rarity || 'common'}`;

            return `
                <div class="mtg-card card-enter" data-color="${color}" data-colors="${(card.colors||[]).join(',')}" style="animation-delay: ${index * 0.08}s">
                    <div class="mtg-card-inner">
                        <div class="mtg-card-frame">
                            <div class="card-header-row">
                                <span class="card-name">${card.name}</span>
                                <span class="mana-cost">${manaHtml}</span>
                            </div>
                            <div class="card-art">
                                <div class="card-art-inner ${artClass}">${artIcon}</div>
                            </div>
                            <div class="card-type-line">
                                ${typeLine}
                                <span class="card-rarity ${rarityClass}"></span>
                            </div>
                            <div class="card-text-box" style="position:relative;">
                                <div class="card-rules">${rulesHtml}</div>
                                ${flavorHtml}
                                ${ptHtml}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // ── Load and render ──
        let allCards = [];
        const grid = document.getElementById('cardGrid');
        const countEl = document.getElementById('cardCount');

        async function loadCards() {
            try {
                const res = await fetch('data/cards.json');
                allCards = await res.json();
                renderAll('all');
            } catch (err) {
                grid.innerHTML = `<div class="text-center" style="grid-column:1/-1;color:#888;">
                    <i class="bi bi-exclamation-triangle fs-1 d-block mb-2"></i>
                    Could not load cards. Make sure <code>data/cards.json</code> exists.
                </div>`;
            }
        }

        function renderAll(filter) {
            const filtered = filter === 'all'
                ? allCards
                : allCards.filter(c => {
                    const color = getCardColor(c.colors);
                    if (filter === 'multi') return color === 'multi';
                    if (filter === 'colorless') return color === 'colorless';
                    return (c.colors || []).includes(filter) && c.colors.length === 1;
                });

            grid.innerHTML = filtered.map((c, i) => renderCard(c, i)).join('');
            countEl.textContent = `${filtered.length} card${filtered.length !== 1 ? 's' : ''} found`;
        }

        // ── Filters ──
        document.getElementById('filters').addEventListener('click', e => {
            const btn = e.target.closest('.filter-btn');
            if (!btn) return;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderAll(btn.dataset.filter);
        });

        loadCards();
    </script>
</body>
</html>
